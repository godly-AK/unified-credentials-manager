name: ucm-production

services:
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ucm
      POSTGRES_USER: ucm
      POSTGRES_PASSWORD: ${UCM_DB_PASSWORD:?Set UCM_DB_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ucm -d ucm"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ../../backend
    restart: unless-stopped
    environment:
      APP_ENV: production
      DB_NAME: ucm
      DB_USER: ucm
      DB_PASSWORD: ${UCM_DB_PASSWORD:?Set UCM_DB_PASSWORD in .env}
      DB_HOST: postgres
      DB_PORT: "5432"
      DATA_ENCRYPTION_KEY: ${UCM_DATA_ENCRYPTION_KEY:?Set UCM_DATA_ENCRYPTION_KEY in .env}
      SESSION_COOKIE_SECURE: "true"
      SESSION_COOKIE_NAME: ucm_session
      CORS_ALLOW_ORIGINS: https://${UCM_DOMAIN:?Set UCM_DOMAIN in .env}
      OFFICE_TRUST_ENABLED: ${UCM_OFFICE_TRUST_ENABLED:-false}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 10

  frontend:
    build:
      context: ../../frontend
      args:
        NEXT_PUBLIC_API_BASE_URL: ""
        UCM_API_INTERNAL_URL: http://backend:8000
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy

  caddy:
    image: caddy:2
    restart: unless-stopped
    environment:
      UCM_DOMAIN: ${UCM_DOMAIN:?Set UCM_DOMAIN in .env}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
